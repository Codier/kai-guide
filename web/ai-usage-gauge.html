<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>AI Usage Gauge</title>
<style>
  /* Dark is the default palette; the light-mode block below overrides these same
     tokens under prefers-color-scheme so the whole page just follows the system
     setting -- nothing else in this file references a raw color, only these vars. */
  :root {
    --bg: #0d0e11; --surface: #16181c; --hair: rgba(255,255,255,.10);
    --track: rgba(255,255,255,.08); --text: #f5f6f7; --muted: rgba(255,255,255,.68);
    --green: #34d399; --amber: #f6b33f; --red: #f5615c;
    --pill-bg: rgba(255,255,255,.08); --input-bg: #0b0c0e;
    --ring-empty: rgba(255,255,255,.15);
    /* Liquid-glass card surface: a translucent gradient + blur over the blurred accent
       blobs behind it -- but tinted DARK, not white. A white wash this thin let whatever
       blob color/value was behind a given letter bleed straight through, so text contrast
       swung all over the card instead of staying reliably readable. */
    --glass-1: rgba(20,21,26,.74); --glass-2: rgba(13,14,17,.55);
    --glass-border: rgba(255,255,255,.14);
    --glass-shadow: 0 30px 70px -24px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.3),
      inset 0 1px 0 rgba(255,255,255,.08);
    --chip-bg: rgba(255,255,255,.16);
    --text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f3f5; --surface: #ffffff; --hair: rgba(0,0,0,.08);
      --track: rgba(0,0,0,.08); --text: #14161a; --muted: rgba(0,0,0,.62);
      --green: #059669; --amber: #b45309; --red: #dc2626;
      --pill-bg: rgba(0,0,0,.06); --input-bg: #f0f1f3;
      --ring-empty: rgba(0,0,0,.15);
      --glass-1: rgba(255,255,255,.72); --glass-2: rgba(255,255,255,.46);
      --glass-border: rgba(255,255,255,.7);
      --glass-shadow: 0 30px 70px -24px rgba(20,20,35,.28), 0 4px 14px rgba(20,20,35,.08),
        inset 0 1px 0 rgba(255,255,255,.7);
      --chip-bg: rgba(255,255,255,.75);
      --text-shadow: 0 1px 2px rgba(255,255,255,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; position: relative; overflow: hidden;
  }
  /* Soft blurred accent blobs the glass card sits above -- this is what the card's
     backdrop-filter actually blurs/tints, giving it something to look "through". */
  .bg-blob {
    position: fixed; z-index: 0; border-radius: 50%; filter: blur(80px); pointer-events: none;
  }
  .bg-blob.b1 { width: 420px; height: 420px; top: -140px; left: -120px; background: #D97757; opacity: .4; }
  .bg-blob.b2 { width: 460px; height: 460px; bottom: -160px; right: -110px; background: #1BC79C; opacity: .35; }
  .bg-blob.b3 { width: 380px; height: 380px; top: 25%; right: 0; background: #9A7CF7; opacity: .32; }
  /* IMPORTANT: never put clamp()/min()/max() inside `padding`, `margin`, or `gap` here.
     Verified against a real engine: a box with `padding: clamp(...)` mis-resolves its own
     width to a content-fit size instead of filling/stretching normally -- this is what made
     the whole card sit tiny and cramped even in a full-size browser window. clamp() on
     `width`/`height`/`font-size`/`border-radius` is fine (verified) and used below for the
     continuous in-between scaling; SPACING switches at one clean breakpoint instead. */
  .card {
    /* NOT width:100% -- verified (via CDP) that percentage width here mis-resolves through
       the nested flex/grid descendants (rows/cells/header-grid), collapsing to a tiny
       content-fit size instead of filling the viewport. calc()+vw is a definite length, not
       a percentage needing containing-block resolution, and is unaffected. */
    width: min(900px, calc(100vw - 32px));
    position: relative; z-index: 1;
    background: linear-gradient(165deg, var(--glass-1), var(--glass-2));
    backdrop-filter: blur(34px) saturate(190%);
    -webkit-backdrop-filter: blur(34px) saturate(190%);
    border: 1px solid var(--glass-border);
    border-radius: clamp(16px, 3.4vw, 30px);
    padding: 30px 34px;
    box-shadow: var(--glass-shadow);
    /* text-shadow inherits to every label/number in the card -- a small fixed anchor
       so text keeps a consistent edge no matter which blurred blob color happens to
       be sitting behind it. */
    text-shadow: var(--text-shadow);
  }
  .header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    margin-bottom: 20px; gap: 8px;
  }
  .tag {
    font-size: clamp(9px, 2.4vw, 14px); font-weight: 700; letter-spacing: .06em;
    color: var(--muted); white-space: nowrap;
  }
  .updated {
    font-size: clamp(9px, 2.4vw, 15px); color: var(--muted); cursor: pointer;
    justify-self: end; white-space: nowrap;
  }
  .updated:hover { color: var(--text); }
  /* Page toggle pill -- same idea as the Android widget's header pill: tap to flip
     between the 3-card page and the hidden DeepSeek page. Grid centers it exactly,
     independent of the (unequal-width) tag/timestamp flanks on either side. */
  .pager {
    justify-self: center; display: flex; align-items: center; gap: 6px;
    background: var(--pill-bg); border-radius: 999px;
    padding: 7px 18px;
    cursor: pointer;
  }
  .pager .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pager .dot.active { background: var(--text); }
  .row { display: flex; gap: 12px; }
  /* Each provider gets its own tinted glass tile (--tilebg/--tileborder, set inline per
     cell from that provider's brand color) instead of a hairline divider -- reads as
     three distinct "bento" cards rather than one flat strip. */
  .cell {
    flex: 1 1 0; min-width: 0; text-align: center;
    padding: 18px 14px 14px; position: relative;
    background: var(--tilebg); border: 1px solid var(--tileborder);
    border-radius: clamp(14px, 2.6vw, 22px);
  }
  .plabel {
    font-size: clamp(9px, 2vw, 11px); font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
  }
  .chip {
    width: clamp(20px, 6.5vw, 44px); height: clamp(20px, 6.5vw, 44px); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;
    background: var(--chip-bg);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.5), 0 1px 3px rgba(0,0,0,.08);
  }
  .chip svg { width: 55%; height: 55%; }
  /* Per-cell --ringglow tints the whole ring in that provider's (or, if critical, red's)
     color so the severity/identity signal reads before you even look at the number. */
  .ring-wrap {
    position: relative; width: clamp(46px, 22vw, 132px); height: clamp(46px, 22vw, 132px); margin: 0 auto;
    filter: drop-shadow(0 6px 14px var(--ringglow));
  }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-mid { position: absolute; inset: 0; display: flex; flex-direction: column;
              align-items: center; justify-content: center; }
  .pct { font-size: clamp(13px, 6vw, 34px); font-weight: 700; line-height: 1; }
  .pct span { font-size: clamp(7px, 2.6vw, 15px); font-weight: 700; }
  .sub { font-size: clamp(6.5px, 2vw, 12px); font-weight: 700; color: var(--muted); letter-spacing: .04em; margin-top: 4px; }
  .reset { font-size: clamp(6.5px, 2vw, 12px); font-weight: 700; color: var(--text); margin-top: 2px; }
  .balance-num { font-size: clamp(15px, 6vw, 30px); font-weight: 700; margin-top: 40px; }
  .balance-sub { font-size: clamp(6.5px, 2vw, 12px); font-weight: 700; color: var(--muted); letter-spacing: .04em; margin-top: 5px; }
  .weekly { margin-top: 20px; }
  .weekly-row { display: flex; align-items: baseline; justify-content: space-between; font-size: clamp(6.5px, 2.4vw, 14px); gap: 4px; }
  .weekly-row .label { color: var(--muted); font-weight: 700; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .weekly-row .label b { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .weekly-row .val { font-weight: 700; flex: none; }
  .bar { height: clamp(4px, 1.4vw, 7px); border-radius: 4px; background: var(--track); margin-top: 5px; overflow: visible; }
  .bar > div { height: 100%; background: var(--green); border-radius: 4px;
    box-shadow: 0 0 6px var(--barglow, transparent); }

  /* Mid-window profile: fonts keep shrinking continuously via vw-based clamp(), but without
     this step the fixed "large" spacing below survives all the way down to 480px -- there's
     a real gap (roughly 480-630px) where the padding hasn't shrunk yet but the clamp()'d font
     already has, so .weekly-row .label runs out of room and its ellipsis kicks in ("WEEKLY"
     becomes "WEEKL…"). This is a halfway point between the default and the <=480px profile
     below (which, being later in the file, still wins at <=480px). */
  @media (max-width: 640px) {
    html, body { padding: 10px; }
    .card { width: min(900px, calc(100vw - 20px)); padding: 18px 20px; }
    .header { margin-bottom: 12px; gap: 6px; }
    .pager { padding: 5px 13px; }
    .row { gap: 8px; }
    .cell { padding: 12px 8px 10px; }
    .plabel { margin-bottom: 8px; }
    .chip { margin: 0 auto 6px; }
    .balance-num { margin-top: 16px; }
    .weekly { margin-top: 12px; }
    .footer { margin-top: 14px; }
  }

  /* Small-window ("Mac widget") profile: spacing shrinks at one clean breakpoint instead of
     a buggy clamp(). Sizes/fonts above keep scaling continuously via their own vw-based clamp(). */
  @media (max-width: 480px) {
    html, body { padding: 6px; }
    .card { width: min(900px, calc(100vw - 12px)); padding: 10px 12px; }
    .header { margin-bottom: 6px; gap: 4px; }
    .pager { padding: 3px 9px; }
    .row { gap: 4px; }
    .cell { padding: 8px 2px 8px; }
    .plabel { margin-bottom: 3px; }
    .chip { margin: 0 auto 4px; }
    .balance-num { margin-top: 8px; }
    .weekly { margin-top: 6px; }
    .footer { margin-top: 8px; }
  }

  #setup { max-width: 420px; margin: 0 auto; }
  #setup h1 { font-size: 18px; margin: 0 0 6px; }
  #setup p { font-size: 13px; color: var(--muted); line-height: 1.5; }
  #setup label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  #setup input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--hair);
    background: var(--input-bg); color: var(--text); font-size: 13px;
  }
  #setup button {
    margin-top: 18px; width: 100%; padding: 11px; border-radius: 10px; border: none;
    background: var(--green); color: #06231a; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  #setup .err { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }
  .gear { cursor: pointer; color: var(--muted); font-size: clamp(10px, 2.2vw, 13px); }
  .gear:hover { color: var(--text); }
  .footer { text-align: center; margin-top: 22px; font-size: clamp(9px, 2vw, 12px); color: var(--muted); }
</style>
</head>
<body>

<div class="bg-blob b1" aria-hidden="true"></div>
<div class="bg-blob b2" aria-hidden="true"></div>
<div class="bg-blob b3" aria-hidden="true"></div>

<div class="card" id="setupCard" style="display:none">
  <div id="setup">
    <h1>AI Usage Gauge — Setup</h1>
    <p>Enter your bridge URL and bearer token. Both are stored only in this browser's
       <code>localStorage</code> — never written into this file, never sent anywhere but your bridge.</p>
    <label>Bridge URL</label>
    <input id="urlInput" placeholder="https://your-tunnel.trycloudflare.com" autocomplete="off" />
    <label>Bearer token</label>
    <input id="tokenInput" type="password" placeholder="token" autocomplete="off" />
    <button id="saveBtn">Save &amp; Connect</button>
    <div class="err" id="setupErr"></div>
  </div>
</div>

<div class="card" id="mainCard" style="display:none">
  <div class="header">
    <div class="tag">AI USAGE</div>
    <div class="pager" id="pager" title="Click to switch page"></div>
    <div class="updated" id="updated" title="Click to reconfigure">Updated —</div>
  </div>
  <div class="row" id="cardsRow"></div>
  <div class="footer">
    <span class="gear" id="gear">⚙ reconfigure</span>
  </div>
</div>

<script>
const ORDER = [
  { key: "claude",   label: "Claude",   color: "#D97757" },
  { key: "codex",    label: "Codex",    color: "#1BC79C" },
  { key: "droid",    label: "Droid",    color: "#9A7CF7" },
  { key: "deepseek", label: "DeepSeek", color: "#7C93FF" },
];

const LS_URL = "aiUsageGauge.bridgeUrl";
const LS_TOKEN = "aiUsageGauge.bridgeToken";

// Same paging model as the Android widget: it never shows all 4 cards at once either
// (wide/medium layout always shows one 3-card page, DeepSeek lives on a second page
// reached by tapping the header pill). Mirroring that here means the layout doesn't
// need separate "4 cards vs 3 cards" breakpoint logic -- it's just always page 0 or 1,
// which also happens to be exactly what stays readable down to a small window.
const PAGES = [["claude", "codex", "droid"], ["deepseek"]];
let currentPage = 0;
let lastData = null;

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// Each card is themed in its own provider color (ring, glow, weekly bar) below the 70%
// warning threshold. At 70-90% it still switches to amber, and at >=90% to red -- the
// original green/amber/red severity scale stays intact, just with brand color standing
// in for the "green" (comfortably under the limit) tier.
function brandOrCritical(meta, pct) {
  if (pct == null) return cssVar("--ring-empty");
  if (pct >= 90) return cssVar("--red");
  if (pct >= 70) return cssVar("--amber");
  return meta.color;
}

function fmtCoarse(iso) {
  if (!iso) return "";
  const secs = (new Date(iso).getTime() - Date.now()) / 1000;
  if (secs <= 0) return "now";
  const days = Math.floor(secs / 86400);
  if (days > 0) return days + "d";
  const hours = Math.floor(secs / 3600);
  const mins = Math.floor((secs % 3600) / 60);
  if (hours > 0) return hours + "h" + mins + "m";
  return Math.floor(secs / 60) + "m";
}

function fmtShort(iso) {
  if (!iso) return "";
  let secs = (new Date(iso).getTime() - Date.now()) / 1000;
  if (secs <= 0) return "now";
  const days = Math.floor(secs / 86400); secs %= 86400;
  const hours = Math.floor(secs / 3600); secs %= 3600;
  const mins = Math.floor(secs / 60);
  if (days > 0) return days + "d " + hours + "h";
  if (hours > 0) return hours + "h " + mins + "m";
  return mins + "m";
}

function ringSvg(pct, color) {
  // No width/height attrs -- .ring-wrap svg { width:100%; height:100% } scales it to
  // whatever clamp() gives .ring-wrap at the current window size.
  const r = 42, c = 2 * Math.PI * r;
  const frac = pct == null ? 0 : Math.min(100, pct) / 100;
  return `
    <svg viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--track2, var(--track))" stroke-width="8" />
      <circle cx="48" cy="48" r="${r}" fill="none" stroke="${color}" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}" />
    </svg>`;
}

// Inline custom props on the .cell root -- --tilebg/--tileborder/--track2 set the tile's
// brand tint, --ringglow/--barglow feed the CSS drop-shadow/box-shadow glows. Keeping
// them all on one element means the CSS never needs per-provider selectors.
function tileVars(meta) {
  return `--tilebg:${meta.color}1A;--tileborder:${meta.color}2E;--track2:${meta.color}26`;
}

function providerCell(meta, p) {
  if (meta.key === "deepseek") {
    const bal = p && p.balance != null ? p.balance.toFixed(2) : "—";
    const cur = (p && p.currency) || "";
    const sym = cur === "CNY" || cur === "RMB" ? "¥" : cur === "USD" ? "$" : cur === "EUR" ? "€" : "";
    return `
      <div class="cell" style="${tileVars(meta)}">
        <div class="chip">${providerGlyph(meta.key, meta.color)}</div>
        <div class="plabel">${meta.label}</div>
        <div class="balance-num" style="color:${meta.color}">${sym}${bal}</div>
        <div class="balance-sub">CREDIT · ${cur}</div>
      </div>`;
  }
  const five = p && p.five_hour ? p.five_hour.pct : null;
  const fiveReset = p && p.five_hour ? fmtShort(p.five_hour.resets_at) : "";
  const wk = p && p.weekly ? p.weekly.pct : null;
  const wkReset = p && p.weekly ? fmtCoarse(p.weekly.resets_at) : "";
  const color = brandOrCritical(meta, five);
  const barColor = wk == null ? cssVar("--ring-empty") : brandOrCritical(meta, wk);
  // Only hex brand/red colors take a trailing alpha suffix for the glow -- the
  // "no data" case (--ring-empty, already a translucent rgba()) just gets no glow.
  const glow = five == null ? "transparent" : color + "55";
  const barGlow = wk == null ? "transparent" : barColor + "55";
  return `
    <div class="cell" style="${tileVars(meta)};--ringglow:${glow};--barglow:${barGlow}">
      <div class="chip">${providerGlyph(meta.key, meta.color)}</div>
      <div class="plabel">${meta.label}</div>
      <div class="ring-wrap">
        ${ringSvg(five, color)}
        <div class="ring-mid">
          <div class="pct" style="color:${five == null ? 'var(--muted)' : color}">${five == null ? '—' : five}${five == null ? '' : '<span>%</span>'}</div>
          <div class="sub">5-HOUR</div>
          ${fiveReset ? `<div class="reset">${fiveReset}</div>` : ""}
        </div>
      </div>
      <div class="weekly">
        <div class="weekly-row">
          <span class="label">WEEKLY${wkReset ? ` <b>· ${wkReset}</b>` : ""}</span>
          <span class="val">${wk == null ? "—" : wk + "%"}</span>
        </div>
        <div class="bar"><div style="width:${wk || 0}%;background:${barColor}"></div></div>
      </div>
    </div>`;
}

// Exact path data lifted from the Android app's own vector drawables
// (android/app/src/main/res/drawable/ic_provider_*.xml) so the icons match pixel-for-pixel.
function providerGlyph(key) {

function bridgeConfig() {
  const url = localStorage.getItem(LS_URL);
  const token = localStorage.getItem(LS_TOKEN);
  return url && token ? { url: url.replace(/\/$/, ""), token } : null;
}

function showSetup(err) {
  document.getElementById("setupCard").style.display = "block";
  document.getElementById("mainCard").style.display = "none";
  document.getElementById("setupErr").textContent = err || "";
  const cfg = bridgeConfig();
  if (cfg) {
    document.getElementById("urlInput").value = cfg.url;
    document.getElementById("tokenInput").value = cfg.token;
  }
}

function showMain() {
  document.getElementById("setupCard").style.display = "none";
  document.getElementById("mainCard").style.display = "block";
}

async function refresh() {
  const cfg = bridgeConfig();
  if (!cfg) return showSetup();
  try {
    const res = await fetch(cfg.url + "/usage", {
      headers: { Authorization: "Bearer " + cfg.token },
    });
    if (res.status === 401) return showSetup("Bridge rejected the token (401) — check it and re-save.");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    showMain();
    render(data);
  } catch (e) {
    showSetup("Couldn't reach the bridge: " + e.message + ". Check the URL and your connection.");
  }
}

// Called after a real bridge fetch: stores the data, paints the current page, and
// stamps the timestamp. Page toggling (renderCards) reuses lastData without refetching
// and deliberately does NOT touch the timestamp -- switching pages isn't a data refresh.
function render(data) {
  lastData = data;
  renderCards();
  const now = new Date();
  document.getElementById("updated").textContent =
    "Updated " + now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function renderCards() {
  if (!lastData) return;
  const keys = PAGES[currentPage];
  document.getElementById("cardsRow").innerHTML =
    keys.map(key => providerCell(ORDER.find(m => m.key === key), lastData[key])).join("");
  document.getElementById("pager").innerHTML =
    PAGES.map((_, i) => `<span class="dot${i === currentPage ? " active" : ""}"></span>`).join("");
}

document.getElementById("saveBtn").addEventListener("click", () => {
  const url = document.getElementById("urlInput").value.trim();
  const token = document.getElementById("tokenInput").value.trim();
  if (!url || !token) {
    document.getElementById("setupErr").textContent = "Both fields are required.";
    return;
  }
  localStorage.setItem(LS_URL, url);
  localStorage.setItem(LS_TOKEN, token);
  refresh();
});

// () => showSetup() -- NOT addEventListener("click", showSetup): the listener would
// otherwise get the click's PointerEvent passed in as `err` and render "[object PointerEvent]".
document.getElementById("gear")?.addEventListener("click", () => showSetup());
document.getElementById("updated").addEventListener("click", () => showSetup());

// Delegated to the parent (not the inner <span> dots, which get replaced every render).
document.getElementById("pager").addEventListener("click", () => {
  currentPage = (currentPage + 1) % PAGES.length;
  renderCards();
});

refresh();
setInterval(refresh, 60000); // poll every 60s, same spirit as the widget's periodic refresh
</script>
